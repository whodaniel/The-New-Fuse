<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    (function() {
      const h = window.location.hostname;
      const p = window.location.pathname;
      if (h === 'thenewfuse.com' || h === 'www.thenewfuse.com') {
        if (p.startsWith('/auth') || p.startsWith('/login') || p.startsWith('/register') || p.startsWith('/dashboard')) {
          window.location.replace('https://app.thenewfuse.com' + p + window.location.search + window.location.hash);
        }
      }
    })();
  </script>
  <title>The New Fuse — AI Agent Orchestration Platform</title>
  <meta name="description" content="Orchestrate intelligent workflows, enable seamless agent communication, and unlock the full potential of AI automation with The New Fuse.">
  
  <style>
    :root {
      --bg-deep: #020617;
      --text: #f8fafc;
      --gradient-primary: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    }
    body {
      font-family: sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.5));
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      max-width: 500px;
      line-height: 1.6;
    }
    .btn {
      margin-top: 2rem;
      padding: 12px 24px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 4L28 10V22L16 28L4 22V10L16 4Z" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 8L24 12V20L16 24L8 20V12L16 8Z" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#8B5CF6"/>
  </svg>
  <h1>The New Fuse</h1>
  <p>AI Agent Orchestration Platform. We are currently moving the application to the <strong>app.</strong> subdomain.</p>
  <a href="https://app.thenewfuse.com/auth/login" class="btn">Go to Login</a>
</body>
</html>
