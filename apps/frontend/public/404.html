<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      const h = window.location.hostname;
      const p = window.location.pathname;
      const s = window.location.search;
      const f = window.location.hash;
      
      // If we are on the main domain, redirect auth/dashboard to the app subdomain
      if (h === 'thenewfuse.com' || h === 'www.thenewfuse.com') {
        if (p.startsWith('/auth') || p.startsWith('/login') || p.startsWith('/register') || p.startsWith('/dashboard')) {
          window.location.replace('https://app.thenewfuse.com' + p + s + f);
          return;
        }
      }
      
      // Fallback for app subdomain itself (SPA fallback)
      if (h === 'app.thenewfuse.com' || h.startsWith('app.')) {
        window.location.replace('https://app.thenewfuse.com/index.html' + s + f);
        return;
      }

      // Default fallback to landing page
      window.location.replace('https://thenewfuse.com/');
    })();
  </script>
</head>
<body>
  <p>Redirecting you to the correct page...</p>
</body>
</html>
