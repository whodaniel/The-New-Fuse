<!DOCTYPE html>
<html>
<head>
  <title>The New Fuse - Pricing</title>
  <meta http-equiv="refresh" content="0;url=https://thenewfuse.com/#pricing">
  <script>
    // Redirect to pricing section on the main landing page
    // On app subdomain, hash routes must go to thenewfuse.com (the landing site)
    if (window.location.hostname === 'app.thenewfuse.com' || window.location.hostname.startsWith('app.')) {
      window.location.replace('https://thenewfuse.com/#pricing');
    } else {
      window.location.replace('/#pricing');
    }
  </script>
</head>
<body>
  <p>Redirecting to pricing...</p>
</body>
</html>
