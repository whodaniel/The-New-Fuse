<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuse Bookmarks Manager</title>
    <style>
      :root {
        --neon-cyan: #00d9ff;
        --bg-deep: #0a0a0f;
        --bg-card: #12121a;
        --bg-elevated: #1a1a25;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --text-muted: rgba(255, 255, 255, 0.4);
        --border-subtle: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg-deep);
        color: var(--text-primary);
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px;
      }
      header.page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      p.subtitle {
        color: var(--text-secondary);
        margin: 4px 0 0;
        font-size: 13px;
      }
      .stats-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 12px 18px;
        min-width: 100px;
      }
      .stat-card strong {
        display: block;
        font-size: 22px;
        color: var(--neon-cyan);
      }
      .stat-card span {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .controls-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      select,
      input[type='text'] {
        background: var(--bg-elevated);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 13px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 9px 16px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      .btn-primary {
        background: var(--neon-cyan);
        color: #041018;
      }
      .btn-secondary {
        background: var(--bg-elevated);
        color: var(--text-primary);
      }
      .btn-secondary:disabled,
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .progress-bar {
        height: 6px;
        border-radius: 3px;
        background: var(--bg-elevated);
        overflow: hidden;
        margin-bottom: 16px;
        display: none;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--neon-cyan);
        transition: width 0.2s ease;
      }
      .subtabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border-subtle);
        margin-bottom: 16px;
      }
      .subtab {
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0;
        padding: 8px 14px;
      }
      .subtab.active {
        color: var(--text-primary);
        border-bottom: 2px solid var(--neon-cyan);
      }
      .subtab-panel {
        display: none;
      }
      .subtab-panel.active {
        display: block;
      }
      .folder-group {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .folder-group h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--neon-cyan);
      }
      .plan-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--border-subtle);
        font-size: 12.5px;
      }
      .plan-item:first-of-type {
        border-top: 0;
      }
      .plan-item .item-title {
        font-weight: 600;
      }
      .plan-item .item-path {
        color: var(--text-muted);
        font-size: 11px;
      }
      .tag-cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tag-chip {
        background: rgba(0, 217, 255, 0.1);
        border: 1px solid rgba(0, 217, 255, 0.3);
        color: var(--neon-cyan);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      .tag-chip.active {
        background: var(--neon-cyan);
        color: #041018;
      }
      .dup-group {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 10px;
        font-size: 12.5px;
      }
      .dup-group .url {
        color: var(--text-secondary);
        word-break: break-all;
        margin-bottom: 4px;
      }
      .result-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .result-card a {
        color: var(--text-primary);
        font-weight: 600;
        text-decoration: none;
        font-size: 13px;
      }
      .result-card .summary {
        color: var(--text-secondary);
        font-size: 12px;
        margin: 4px 0;
      }
      .empty-note {
        color: var(--text-muted);
        font-size: 13px;
        padding: 16px 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="page-header">
        <div>
          <h1>🔖 Fuse Bookmarks Manager</h1>
          <p class="subtitle">AI-organized, non-destructive — everything lives under "AI Organized" until you Apply.</p>
        </div>
      </header>

      <div class="stats-row">
        <div class="stat-card"><strong id="stat-bookmarks">–</strong><span>Bookmarks</span></div>
        <div class="stat-card"><strong id="stat-folders">–</strong><span>Folders</span></div>
        <div class="stat-card"><strong id="stat-duplicates">–</strong><span>Duplicates</span></div>
        <div class="stat-card"><strong id="stat-lastrun">–</strong><span>Last Analyzed</span></div>
      </div>

      <div class="controls-row">
        <select id="mgr-granularity">
          <option value="compact">Compact</option>
          <option value="balanced" selected>Balanced</option>
          <option value="detailed">Detailed</option>
        </select>
        <label style="font-size: 12px; color: var(--text-secondary)">
          <input type="checkbox" id="mgr-zero-folder" /> Zero-folder mode
        </label>
        <button class="btn-primary" id="mgr-analyze-btn">✨ Analyze</button>
        <button class="btn-secondary" id="mgr-cancel-btn" style="display: none">Cancel</button>
        <button class="btn-secondary" id="mgr-apply-btn" disabled>Apply Selected</button>
        <button class="btn-secondary" id="mgr-undo-btn" disabled>Undo Last</button>
      </div>

      <div class="progress-bar" id="mgr-progress-bar">
        <div class="progress-fill" id="mgr-progress-fill"></div>
      </div>

      <nav class="subtabs">
        <button class="subtab active" data-subtab="tree">Folder Tree Diff</button>
        <button class="subtab" data-subtab="tags">Tag Cloud</button>
        <button class="subtab" data-subtab="duplicates">Duplicates</button>
        <button class="subtab" data-subtab="search">Search</button>
      </nav>

      <section class="subtab-panel active" id="panel-tree">
        <div id="tree-container"><div class="empty-note">Run Analyze to see a proposed folder tree.</div></div>
      </section>

      <section class="subtab-panel" id="panel-tags">
        <div id="tag-cloud-container"><div class="empty-note">No tags yet — run Analyze first.</div></div>
        <div id="tag-filtered-results" style="margin-top: 16px"></div>
      </section>

      <section class="subtab-panel" id="panel-duplicates">
        <div id="duplicates-container"><div class="empty-note">No duplicates found yet.</div></div>
      </section>

      <section class="subtab-panel" id="panel-search">
        <div class="controls-row">
          <input type="text" id="mgr-search-input" placeholder="Search your bookmarks…" style="flex: 1" />
          <button class="btn-secondary" id="mgr-search-btn">Search</button>
        </div>
        <div id="search-results-container"></div>
      </section>
    </div>

    <script src="bookmarks.js" defer></script>
  </body>
</html>
