name: Privacy And Security Gate (Self-hosted)

# Security remains automatic, but it runs once on the PR using operator-owned
# capacity. The same protections also exist in local pre-push tooling.
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-security-gate:
    name: Privacy, Secrets, and Supabase RLS Gate
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify local toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Build changed file list
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | sort -u > .tnf_changed_files
          cat .tnf_changed_files || true
      - name: Classify conflict tier
        run: node scripts/protocols/classify-change-tier.cjs --mode=ci --file-list=.tnf_changed_files --fail-on=escalate
      - name: Enforce session handoff protocol
        run: |
          node scripts/protocols/validate-turn-zero-authority.cjs --mode=ci
          node scripts/protocols/validate-handoff-source-drift.cjs --mode=ci
          TNF_HANDOFF_FILE_LIST=.tnf_changed_files node scripts/protocols/enforce-session-handoff.cjs --mode=ci
      - name: Run privacy and secret guards
        run: |
          node scripts/security/privacy-guard.cjs --mode=repo
          node scripts/security/secret-sweep.cjs --mode=repo
          node scripts/security/docs-pii-guard.cjs --mode=repo
      - name: Run Supabase RLS audit
        run: node scripts/security/supabase-rls-audit.cjs --strict --baseline=scripts/security/supabase-rls-baseline.json
