name: Build Verification (Manual)

# Cost policy: heavyweight build verification is opt-in. Normal development
# runs locally; the narrow ci-build.yml remains the PR correctness gate.
on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run production smoke checks after build"
        required: false
        type: boolean
        default: true

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  PNPM_VERSION: 10.22.0
  BUILD_MEMORY_LIMIT: 4096
  BUILD_CONCURRENCY: 2

jobs:
  full-build:
    name: Manual full build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install once
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Build packages
        run: pnpm run build:packages
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build shipping apps sequentially
        run: |
          pnpm run build:api-gateway
          pnpm run build:api
          pnpm run build:backend
          pnpm run build:frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify primary artifacts
        run: |
          test -d apps/frontend/dist
          test -d apps/api/dist -o -d apps/api/build
          test -d apps/backend/dist -o -d apps/backend/build
          test -d apps/api-gateway/dist -o -d apps/api-gateway/build

      - name: Production smoke checks
        if: ${{ inputs.run_smoke }}
        run: |
          test -f apps/frontend/dist/index.html -o -f apps/frontend/dist/app.html
          (cd apps/backend && timeout 30s pnpm start || true)
          (cd apps/api-gateway && timeout 30s pnpm start || true)

      - name: Cost notice
        if: always()
        run: |
          echo "This workflow is intentionally manual-only." >> "$GITHUB_STEP_SUMMARY"
          echo "Prefer local/self-hosted TNF execution for routine development." >> "$GITHUB_STEP_SUMMARY"
