# Auto-deploy the frontend to Cloudflare Pages on every push to main.
#
# Project: thenewfuse-main (serves app.thenewfuse.com, thenewfuse.com, www.thenewfuse.com)
# This project is a DIRECT-UPLOAD Pages project (not Git-connected) — CI deploys
# the built `dist/` via wrangler, keeping existing domain bindings intact.
#
# Required repo secrets (skip-safe: deploy step no-ops with a warning if absent):
#   CLOUDFLARE_API_TOKEN   — API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — Bizsynth account: db1d3832768b2bbad4c5c5d9dbc63f8b
name: Deploy Frontend to Cloudflare Pages

on:
  # Automatic trigger commented out to prevent runner billing failure. Uncomment to re-enable:
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/frontend/**"
  #     - "pnpm-lock.yaml"
  #     - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set — skipping Cloudflare Pages deploy."
            echo "::warning::Add repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit token) and CLOUDFLARE_ACCOUNT_ID (db1d3832768b2bbad4c5c5d9dbc63f8b) to enable auto-deploy."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID=db1d3832768b2bbad4c5c5d9dbc63f8b
          fi
          npx wrangler pages deploy dist --project-name=thenewfuse-main --branch=main
