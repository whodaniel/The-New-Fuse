name: CloudRuntime Maintenance Window

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  maintenance-redeploy:
    runs-on: ubuntu-latest
    env:
      CLOUD_RUNTIME_TOKEN: ${{ secrets.CLOUD_RUNTIME_TOKEN }}
      CLOUD_RUNTIME_PROJECT_ID: 041cee9d-8648-4074-b5a6-0eae436de1d1
      CLOUD_RUNTIME_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudRuntime CLI
        run: npm i -g @cloud_runtime/cli

      - name: Validate CloudRuntime Auth
        run: cloud_runtime whoami

      - name: Link CloudRuntime Project + Environment
        run: cloud_runtime link -p "$CLOUD_RUNTIME_PROJECT_ID" -e "$CLOUD_RUNTIME_ENVIRONMENT"

      - name: Redeploy Redis During Maintenance Window
        run: cloud_runtime redeploy -s Redis

      - name: Redeploy Postgres During Maintenance Window
        run: cloud_runtime redeploy -s Postgres

      - name: Redeploy searxng During Maintenance Window
        run: cloud_runtime redeploy -s searxng
