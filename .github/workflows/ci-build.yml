# Build + typecheck gate for pull requests.
#
# Cost policy: automatic correctness gates use operator-owned self-hosted
# capacity. GitHub-hosted compute is reserved for explicit/manual runs.
name: CI Build (Self-hosted)

on:
  # Automatic trigger commented out to prevent runner billing failure. Uncomment to re-enable:
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "apps/api/**"
  #     - "apps/frontend/**"
  #     - "packages/**"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  #     - "turbo.json"
  #     - ".github/workflows/ci-build.yml"
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and typecheck
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version
      - name: Install
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Build workspace dependencies and apps
        run: pnpm turbo run build --filter=@the-new-fuse/frontend-app... --filter=@the-new-fuse/api-server...
      - name: Typecheck api
        run: pnpm --filter @the-new-fuse/api-server exec tsc --noEmit -p tsconfig.json
      - name: Typecheck frontend
        run: pnpm --filter @the-new-fuse/frontend-app exec tsc --noEmit -p tsconfig.json
      - name: Assert frontend build produced artifacts
        run: |
          test -f apps/frontend/dist/app.html \
            || { echo "::error::apps/frontend/dist/app.html missing — build did not complete"; exit 1; }
