name: Claude Code Review (Manual Opt-In)

# Cost policy: provider-billed AI review must never run automatically on every
# PR update. Dispatch this workflow only when an operator intentionally wants a
# Claude review and accepts the provider usage.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Review this pull request for correctness, security, performance,
            maintainability, and test coverage. Read CLAUDE.md and current TNF
            governance first. Use `gh pr diff` / `gh pr view`, then leave one
            concise review comment on PR ${{ inputs.pr_number }}.
          claude_args: '--allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
