name: Framework Master Graph (Manual)

# Cost policy: graph rebuilds are local/TNF jobs by default. GitHub-hosted
# execution is an explicit operator action only.
on:
  workflow_dispatch:

concurrency:
  group: framework-master-graph-monitor
  cancel-in-progress: true

jobs:
  build-framework-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Build master framework graph
        run: ./tools/framework-master-graph/rebuild_framework_master_graph.sh
      - name: Summarize output locations
        run: |
          echo "Framework graph rebuilt. Artifacts remain in the workspace for this run." >> "$GITHUB_STEP_SUMMARY"
          echo "Routine graph rebuilds should run locally/self-hosted." >> "$GITHUB_STEP_SUMMARY"
