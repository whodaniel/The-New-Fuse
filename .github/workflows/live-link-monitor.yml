name: Live Link Audit (Manual)

# Cost policy: browser crawling is expensive and belongs on local/self-hosted
# TNF capacity by default. GitHub-hosted execution is explicit only.
on:
  workflow_dispatch:

concurrency:
  group: live-link-monitor
  cancel-in-progress: true

jobs:
  crawl-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: pnpm exec playwright install chromium
      - name: Run depth-5 live link audit
        working-directory: apps/frontend
        env:
          LIVE_AUDIT_MAX_DEPTH: "5"
          LIVE_AUDIT_MAX_PAGES: "500"
          LIVE_AUDIT_MAX_EXTERNAL: "400"
          FAIL_ON_BROKEN: "1"
        run: pnpm run audit:live-links
      - name: Run full route semantic audit
        working-directory: apps/frontend
        env:
          SEMANTIC_AUDIT_BASE_URL: "https://thenewfuse.com"
          FAIL_ON_SEMANTIC_ISSUES: "1"
        run: pnpm run audit:all-routes-semantic
      - name: Run auth path audit
        working-directory: apps/frontend
        env:
          AUTH_AUDIT_PUBLIC_BASE_URL: "https://thenewfuse.com"
          AUTH_AUDIT_API_BASE_URL: "https://api.thenewfuse.com"
          FAIL_ON_AUTH_ISSUES: "1"
        run: pnpm run audit:auth-paths
      - name: Generate self-improvement scorecard
        working-directory: apps/frontend
        env:
          FAIL_ON_SCORECARD: "1"
        run: pnpm run audit:self-improvement-scorecard
