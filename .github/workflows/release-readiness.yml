name: Release Readiness Gate (Manual)

# Release validation is intentionally explicit. Routine PR/push correctness is
# handled locally and by narrow self-hosted gates; a full production release
# gate should consume compute only when an operator is actually preparing one.
on:
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Production Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Run strict release gate
        run: pnpm run release:gate:strict
      - name: Cost notice
        if: always()
        run: echo "Release readiness is manual-only by TNF cost policy." >> "$GITHUB_STEP_SUMMARY"
