name: Traits Intelligence (Manual)

# Cost policy: recurring intelligence jobs belong in TNF/local/self-hosted
# scheduling. GitHub-hosted execution is explicit only.
on:
  workflow_dispatch:

jobs:
  traits-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/casin8-games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
        working-directory: .
      - name: Run trait intelligence jobs
        run: |
          node scripts/traits/export-cfr-profile.mjs
          node scripts/traits/ingest-risk-profile.mjs
          node scripts/traits/eval-league.mjs
      - name: Validate trait pipeline tests
        run: node --test swarm/trait-providers.test.mjs swarm/trait-payload-schema.test.mjs
