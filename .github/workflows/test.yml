name: Test Suite (Manual)

# Cost policy: the full repository test suite is local/self-hosted by default.
# GitHub-hosted execution is an explicit operator action. Relevant PRs still get
# the deliberately narrow ci-build.yml correctness gate.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Test scope"
        required: false
        type: choice
        options:
          - core
          - full
        default: core

concurrency:
  group: manual-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install once
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Core tests
        if: ${{ inputs.scope == 'core' }}
        run: |
          pnpm --filter @the-new-fuse/tnf-cli test
          pnpm --filter @the-new-fuse/relay-core test
      - name: Full workspace tests
        if: ${{ inputs.scope == 'full' }}
        run: pnpm test
      - name: Cost notice
        if: always()
        run: echo "Routine test execution belongs on local/self-hosted TNF capacity." >> "$GITHUB_STEP_SUMMARY"
