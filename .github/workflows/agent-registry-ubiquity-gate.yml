name: Agent Registry Ubiquity Gate

# Cost policy: validate once on relevant PRs using operator-owned capacity; do
# not repeat the same install/check after merge.
on:
  # Automatic trigger commented out to prevent runner billing failure. Uncomment to re-enable:
  # pull_request:
  #   branches: [main, develop]
  #   paths:
  #     - ".agent/agents/**"
  #     - ".claude/agents/**"
  #     - "config/ai-agents/**"
  #     - "config/agents/**"
  #     - "scripts/agent-registry/**"
  #     - "data/agent-registry/**"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  #     - ".github/workflows/agent-registry-ubiquity-gate.yml"
  workflow_dispatch:

jobs:
  registry-check:
    name: Validate Agent Registry Artifacts
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify local toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Run agent registry drift check
        run: pnpm run agents:registry:check
