name: Framework Consciousness (Manual)

# Local-first cost policy: framework evolution is TNF work, not recurring
# GitHub-hosted compute. Run it locally or dispatch this workflow explicitly.
on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload framework-consciousness JSON artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: framework-consciousness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evolve-and-guardrails:
    name: Evolve + Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Run framework consciousness evolve
        run: pnpm run framework-consciousness:evolve

      - name: Run framework consciousness guardrails
        run: node scripts/framework-consciousness/guardrail-check.cjs --baseline data/framework-consciousness-baseline.json --allow-partial

      - name: Upload artifacts when explicitly requested
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v5
        with:
          name: framework-consciousness-${{ github.run_id }}
          path: .framework-consciousness/*.json
          retention-days: 7
