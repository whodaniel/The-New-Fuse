name: Integration Train Gate

on:
  # Automatic trigger commented out to prevent runner billing failure. Uncomment to re-enable:
  # pull_request:
  #   branches: [main]
  # Automatic trigger commented out to prevent runner billing failure. Uncomment to re-enable:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  release-train-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce integration train promotion policy
        run: |
          node scripts/protocols/validate-release-train.cjs \
            --allowed-head-prefixes=integration/,hotfix/,sync/ \
            --train-ref=origin/integration/main \
            --allow-missing-train=true
