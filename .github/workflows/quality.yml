name: Quality Gates (Manual)

# Cost policy: broad architecture/browser/quality sweeps are expensive and are
# executed by TNF/local/self-hosted capacity by default. GitHub-hosted execution
# is opt-in for release or diagnostic use.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Quality scope"
        required: false
        type: choice
        options:
          - static
          - frontend-audits
          - full
        default: static

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install once
        run: pnpm install --no-frozen-lockfile --prefer-offline
      - name: Static quality checks
        if: ${{ inputs.scope == 'static' || inputs.scope == 'full' }}
        run: |
          pnpm run lint
          pnpm run type-check
      - name: Frontend architecture audits
        if: ${{ inputs.scope == 'frontend-audits' || inputs.scope == 'full' }}
        run: |
          pnpm --dir apps/frontend run audit:experience-architecture
          pnpm --dir apps/frontend run audit:navigation
      - name: Cost notice
        if: always()
        run: echo "Broad quality sweeps are intentionally manual on GitHub-hosted runners." >> "$GITHUB_STEP_SUMMARY"
