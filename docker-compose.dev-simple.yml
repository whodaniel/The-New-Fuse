# Compatibility shim for scripts/docs that still reference docker-compose.dev-simple.yml.
# Prefer: pnpm run searxng:up (docker-compose.searxng.yml).
services:
  searxng:
    image: searxng/searxng:latest
    container_name: tnf-searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    restart: unless-stopped
    volumes:
      - tnf-searxng-data:/etc/searxng

volumes:
  tnf-searxng-data:
