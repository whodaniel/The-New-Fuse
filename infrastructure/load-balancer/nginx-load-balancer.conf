upstream tnf_backend {
    least_conn;
    server tnf-backend-1.tnf-system.svc.cluster.local:8080 max_fails=3 fail_timeout=30s;
    server tnf-backend-2.tnf-system.svc.cluster.local:8080 max_fails=3 fail_timeout=30s;
    server tnf-backend-3.tnf-system.svc.cluster.local:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tnf_frontend {
    ip_hash;
    server tnf-frontend-1.tnf-system.svc.cluster.local:3000;
    server tnf-frontend-2.tnf-system.svc.cluster.local:3000;
    server tnf-frontend-3.tnf-system.svc.cluster.local:3000;
}

server {
    listen 80;
    server_name api.thenewfuse.com;
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /status {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    
    location / {
        proxy_pass http://tnf_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name api.thenewfuse.com;
    
    ssl_certificate /etc/ssl/certs/tnf.crt;
    ssl_certificate_key /etc/ssl/certs/tnf.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /status {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    
    location / {
        proxy_pass http://tnf_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
