apiVersion: apps/v1
kind: Deployment
metadata:
  name: tnf-redis
  namespace: tnf-system
  labels:
    app: tnf-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tnf-redis
  template:
    metadata:
      labels:
        app: tnf-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: redis-cache
              mountPath: /data
          command:
            [
              "redis-server",
              "--appendonly",
              "yes",
              "--maxmemory",
              "512mb",
              "--maxmemory-policy",
              "allkeys-lru",
            ]
      volumes:
        - name: redis-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tnf-redis-service
  namespace: tnf-system
spec:
  selector:
    app: tnf-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
