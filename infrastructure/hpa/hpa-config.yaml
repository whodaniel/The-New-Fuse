apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tnf-backend-hpa
  namespace: tnf-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tnf-backend
  minReplicas: 3
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tnf-frontend-hpa
  namespace: tnf-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tnf-frontend
  minReplicas: 5
  maxReplicas: 200
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
    scaleUp:
      stabilizationWindowSeconds: 30
